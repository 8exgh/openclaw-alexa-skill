name: Deploy OpenClaw Alexa bridge
on:
  workflow_dispatch:
  repository_dispatch:
    types: [openclaw-alexa-bridge-deploy]
env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/8exgh/openclaw-alexa-bridge:latest
  CONTAINER: openclaw-alexa-bridge
  POSTGRES_CONTAINER: openclaw-alexa-postgres
  NETWORK: openclaw-alexa
  HOST_PORT: "3070"
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, server7]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.READ_PACKAGES_PAT }}
      - run: docker pull "${IMAGE}"
      - name: Ensure network and PostgreSQL
        env:
          POSTGRES_PASSWORD: ${{ secrets.OPENCLAW_ALEXA_POSTGRES_PASSWORD }}
        run: |
          docker network create "${NETWORK}" || true
          docker volume create openclaw_alexa_postgres_data
          if ! docker ps -a --format '{{.Names}}' | grep -qx "${POSTGRES_CONTAINER}"; then
            docker run -d --name "${POSTGRES_CONTAINER}" --restart unless-stopped \
              --network "${NETWORK}" -v openclaw_alexa_postgres_data:/var/lib/postgresql/data \
              -e POSTGRES_DB=alexa_bridge -e POSTGRES_USER=alexa_bridge -e POSTGRES_PASSWORD \
              postgres:17-alpine
          fi
      - name: Replace bridge
        env:
          ALEXA_APPLICATION_ID: ${{ secrets.OPENCLAW_ALEXA_APPLICATION_ID }}
          POSTGRES_PASSWORD: ${{ secrets.OPENCLAW_ALEXA_POSTGRES_PASSWORD }}
          PUBLIC_BASE_URL: ${{ secrets.OPENCLAW_ALEXA_PUBLIC_BASE_URL }}
          ADMIN_API_TOKEN: ${{ secrets.OPENCLAW_ALEXA_ADMIN_API_TOKEN }}
        run: |
          docker stop "${CONTAINER}" || true
          docker rm "${CONTAINER}" || true
          docker run -d --name "${CONTAINER}" --restart unless-stopped \
            --network "${NETWORK}" -p "${HOST_PORT}:3000" \
            -e NODE_ENV=production -e ALEXA_APPLICATION_ID -e PUBLIC_BASE_URL -e ADMIN_API_TOKEN \
            -e DATABASE_URL="postgresql://alexa_bridge:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER}:5432/alexa_bridge" \
            -e FAST_RESPONSE_BUDGET_MS=5500 -e TASK_TIMEOUT_MS=600000 "${IMAGE}"
      - name: Health check
        run: |
          for attempt in $(seq 1 30); do curl --fail --silent "http://127.0.0.1:${HOST_PORT}/healthz" && exit 0; sleep 2; done
          docker logs "${CONTAINER}" --tail 100
          exit 1
      - run: docker image prune -af --filter "until=24h"
